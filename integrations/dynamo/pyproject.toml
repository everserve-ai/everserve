[project]
name = "everserve-dynamo"
version = "0.0.1"
description = "Everserve's integration with NVIDIA Dynamo: an instance protected inside Dynamo's graph."
readme = "README.md"
requires-python = ">=3.10"
# the table forms: the build backend CI resolves predates PEP 639's expression and list
license = { text = "Apache-2.0" }
license-files = { paths = ["LICENSE"] }
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = [
  "everserve",
  "everserve-vllm",
]

[tool.uv.sources]
everserve = { workspace = true }
everserve-vllm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["everserve_dynamo"]
