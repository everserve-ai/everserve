[package]
name = "everserve-controller"
description = "Everserve control plane: node daemon and coordinator (notices, spare pool, rejoin, metrics, CLI)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "everserve_controller"
path = "src/lib.rs"

[[bin]]
name = "everserve-controller"
path = "src/main.rs"

[dependencies]
everserve-telemetry = { path = "../telemetry" }
everserve-wire = { path = "../wire" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "matched-path", "query"] }
bytes = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1", default-features = false, features = ["process", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
clap = { version = "4", features = ["derive", "env"] }
prost = "0.14"
# the digest the operator API keys its token cache by; rustls links it already
ring = "0.17"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-core = "0.3"
utoipa = { version = "6", default-features = false, features = ["macros"] }
utoipa-axum = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
etcd-client = { version = "0.21", features = ["tls"] }

[dev-dependencies]
everserve-store = { path = "../store" }
everserve-telemetry = { path = "../telemetry" }
everserve-wire = { path = "../wire" }
tempfile = "3"
tokio-util = { version = "0.7" }

[build-dependencies]
prost = "0.14"
pbjson-build = "0.8"
prost-build = "0.14"
protox = "0.9"

[lints]
workspace = true
