#
# A release: a tag vX.Y.Z builds the control plane's image, pushes it, signs it by digest with this
# workflow's own identity (Sigstore keyless: no key to keep or leak), attests its SBOM, and pushes
# the chart at the same version, signed the same way. The tag, the workspace's version, the
# chart's version and its appVersion must agree, or nothing is pushed. Run by hand, it is a dry
# run: every check and build, nothing pushed or signed.
#
# Verify a release:
#   cosign verify ghcr.io/everserve-ai/everserve:X.Y.Z \
#     --certificate-identity-regexp '^https://github.com/everserve-ai/everserve/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/everserve-ai/everserve
  CHARTS: oci://ghcr.io/everserve-ai/charts

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # the workflow's identity, which signs
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # one version everywhere, or no release
      - id: version
        run: |
          workspace="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          chart="$(sed -n 's/^version: //p' deploy/kubernetes/everserve/Chart.yaml)"
          app="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' deploy/kubernetes/everserve/Chart.yaml)"
          echo "workspace $workspace, chart $chart, appVersion $app"
          [[ -n "$workspace" && "$workspace" == "$chart" && "$workspace" == "$app" ]] \
            || { echo "the workspace, the chart and its appVersion disagree"; exit 1; }
          # the Python packages version with the workspace: each manifest's version
          for pkg in core adapters/vllm integrations/dynamo; do
            v="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$pkg/pyproject.toml")"
            [[ "$v" == "$workspace" ]] || { echo "$pkg is $v, the workspace $workspace"; exit 1; }
          done
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$workspace" ]] \
              || { echo "tag $GITHUB_REF_NAME is not v$workspace"; exit 1; }
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$workspace" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.version.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ steps.version.outputs.push == 'true' }}
          load: ${{ steps.version.outputs.push != 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/everserve-ai/everserve
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: the image runs
        if: steps.version.outputs.push != 'true'
        run: |
          docker run --rm "$IMAGE:${{ steps.version.outputs.version }}" --version
          docker run --rm --entrypoint /usr/local/bin/everserve-store "$IMAGE:${{ steps.version.outputs.version }}" --version
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: helm package deploy/kubernetes/everserve --destination dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.version.outputs.push == 'true'
        with:
          cosign-release: v3.1.3
      # signed by digest, never by tag: a tag can move, a digest cannot
      - name: sign the image and attest its SBOM
        if: steps.version.outputs.push == 'true'
        timeout-minutes: 10
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
      - name: push and sign the chart
        if: steps.version.outputs.push == 'true'
        timeout-minutes: 10
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          pushed="$(helm push "dist/everserve-${{ steps.version.outputs.version }}.tgz" "$CHARTS" 2>&1)"
          echo "$pushed"
          digest="$(echo "$pushed" | sed -n 's/^Digest: //p')"
          [[ -n "$digest" ]] || { echo "helm push printed no digest"; exit 1; }
          cosign sign --yes "ghcr.io/everserve-ai/charts/everserve@$digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            sbom.spdx.json
            dist/
