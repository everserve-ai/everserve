[workspace]
resolver = "2"
members = ["wire", "telemetry", "controller", "store"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
# not published to crates.io: the binaries ship as the image and the chart (release.yml)
publish = false
repository = "https://github.com/everserve-ai/everserve"
rust-version = "1.97"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
