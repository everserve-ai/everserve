[package]
name = "everserve-wire"
description = "Everserve wire schema (generated from proto/), the frame protocol and the two transports (Unix socket, TCP under mutual TLS) shared by every Rust process."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pbjson = "0.8"
pbjson-types = "0.8"
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
pbjson-build = "0.8"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"

[lints]
workspace = true
