[project]
name = "everserve"
version = "0.0.1"
description = "Engine-independent runtime that keeps a multi-GPU inference engine serving while its GPUs change."
readme = "README.md"
requires-python = ">=3.10"
# the table forms: the build backend CI resolves predates PEP 639's expression and list
license = { text = "Apache-2.0" }
license-files = { paths = ["LICENSE"] }
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = [
  "ninja>=1.11",  # torch's extension builder, for everserve.kernels
  "numpy>=1.26",
  "protobuf>=6.31.1,<8",  # the generated code's version (gencode 6.31.1) and the next major
  "torch>=2.13",
]

[project.urls]
Repository = "https://github.com/everserve-ai/everserve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["everserve"]

[tool.hatch.build.targets.wheel.force-include]
# the kernel sources travel with the package; everserve.kernels builds them against the
# installed torch (see core/csrc/README.md)
"csrc" = "everserve/_csrc"
