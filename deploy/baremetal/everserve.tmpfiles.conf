# Directories the Everserve services need, created at boot (/etc/tmpfiles.d/everserve.conf).
# The workers' processes connect to the sockets under /run/everserve and make and map files under
# /dev/shm/everserve: run them as members of the everserve group. Both are the group's, setgid, so
# what is made inside is the group's too; the daemon and the store make theirs with umask 007.
d /run/everserve      2770 everserve everserve -
d /dev/shm/everserve  2770 everserve everserve -
d /var/lib/everserve  0750 everserve everserve -
