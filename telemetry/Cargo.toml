[package]
name = "everserve-telemetry"
description = "Everserve metrics and health: a Prometheus registry and the HTTP endpoint every Rust process serves."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
prometheus = { version = "0.14", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }

[lints]
workspace = true
